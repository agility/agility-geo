name: Publish to npm

# Publishes on a `v<version>` tag that matches package.json, through npm Trusted Publishing (OIDC):
# no npm token is stored in the repo. Configure the trusted publisher on npmjs.com for
# repository agility/agility-geo, workflow file npm-publish.yml, environment npm.
#
# Modelled on agility-content-fetch-js-sdk's npm-publish.yml: every version goes out under the
# `beta` dist-tag, and is promoted to `latest` by hand.
# npm provenance needs a PUBLIC source repository; the publish step fails while the repo is private.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm Trusted Publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for [$VERSION]."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later (bundled with Node 24).
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Always publish under the beta dist-tag. Promote to latest manually:
      #   npm dist-tag add @agility/geo@<version> latest
      - name: Publish
        run: npm publish --provenance --access public --tag beta

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --prerelease
